services:
  - type: web
    name: aircontrol-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
